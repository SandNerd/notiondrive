# CI workflow for npm projects.
# Generated by the /release skill. Adapt as needed.

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - run: npm test

      - name: Advisory Rigour qualification
        continue-on-error: true
        run: npm run qualify:rigour

      - name: Preserve raw Rigour report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rigour-report
          path: |
            rigour-report.json
            .not2-evidence/rigour-candidate-81f4fa4.json
            .not2-evidence/rigour-candidate-81f4fa4.json.metadata.json
          if-no-files-found: warn

      - name: Upload qualification provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rigour-qualification-evidence
          path: |
            .not2-evidence/rigour-main-81f4fa4.json
            .not2-evidence/rigour-main-81f4fa4.json.metadata.json
          if-no-files-found: error
